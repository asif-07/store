


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edapt Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1e40af',
            secondary: '#3b82f6',
            accent: '#f59e0b',
            dark: '#1f2937'
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-up': 'slideUp 0.6s ease-out',
            'bounce-gentle': 'bounceGentle 2s infinite',
            'cart-highlight': 'cartHighlight 0.6s ease-in-out' // New animation for cart
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes bounceGentle {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
      60% { transform: translateY(-3px); }
    }
    /* New animation for cart highlight */
    @keyframes cartHighlight {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.3); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .glass-effect {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .product-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    .floating-cart {
      animation: bounceGentle 3s infinite;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const csvData = `
ID,Name,Image,Price,Stock,Category,Description
1,Grade 1 Hello Ai Book,https://m.media-amazon.com/images/I/71vZIReYJ9L._SY425_.jpg,439,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
2,Grade 2 Hello Ai Book,https://m.media-amazon.com/images/I/81pqCpRzqBL._SY425_.jpg,459,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
3,Grade 3 Hello Ai Book,https://m.media-amazon.com/images/I/81Ss6PI3KZL._SY425_.jpg._SY425_.jpg,479,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
4,Grade 4 Hello Ai Book,https://m.media-amazon.com/images/I/81zBaPbFzBL._SY425_.jpg,489,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
5,Grade 5 Hello Ai Book,https://m.media-amazon.com/images/I/81OjcvfrC7L._SY425_.jpg,499,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
6,Grade 6 Hello Ai Book,https://m.media-amazon.com/images/I/41ILTZHDN8L._SY445_SX342_.jpg,549,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
7,Grade 7 Hello Ai Book,https://m.media-amazon.com/images/I/41+a8SC59wL._SY445_SX342_.jpg,599,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
8,Grade 8 Hello Ai Book,https://m.media-amazon.com/images/I/41LrCykhq3L._SY445_SX342_.jpg,649,in,Hello Ai Book,This textbook is designed to deepen young learners' understanding of (technology artificial intelligence-coding- and robotics through engaging and interactive educational experiences.
9,Otto Ninja Robot,https://media.printables.com/media/prints/231580/images/2105481_96ae0b41-56eb-4850-a528-98a0116d7100/thumbs/inside/1600x1200/png/ottoninjastarterrobotw.webp,4000,in,Robotics,Unique open source robot that walks and transforms into a wheeled racer! made by Sebastian Coddington.
10,3D Printer,https://m.media-amazon.com/images/I/61ibc33EJKL._SY679_.jpg,32000,in,Robotics,Creality Ender-3 S1 3d Printer- Direct Extruder- Automatic Leveling- PC Sheet- Power Outage Recovery- Filament Sensor- Dual Z Axis- 96% Assembly- Silent- Japanese FDM 3d Printer.
`;

    // Product Detail Modal Component
    const ProductDetailModal = ({ product, onClose, addToCart, cart, toggleCart }) => {
      if (!product) return null;

      const isInCart = cart.some(item => item.ID === product.ID);

      return (
        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 animate-fade-in">
          <div className="bg-white rounded-xl shadow-2xl p-8 max-w-2xl w-full mx-4 relative transform animate-slide-up">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-3xl font-light"
            >
              &times;
            </button>
            <div className="flex flex-col md:flex-row gap-6">
              <div className="md:w-1/2">
                <img src={product.Image} alt={product.Name} className="w-full h-auto object-contain rounded-lg shadow-sm" />
              </div>
              <div className="md:w-1/2 flex flex-col justify-between">
                <div>
                  <h2 className="text-3xl font-bold text-gray-900 mb-2">{product.Name}</h2>
                  <p className="text-gray-600 mb-4">{product.Description}</p>
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-4xl font-extrabold text-blue-700">
                      ₹{parseFloat(product.Price).toLocaleString()}
                    </span>
                    <span className={`px-3 py-1 text-sm font-semibold rounded-full ${
                      product.Stock === "in" ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                    }`}>
                      {product.Stock === "in" ? 'In Stock' : 'Out of Stock'}
                    </span>
                  </div>
                  <div className="flex items-center space-x-1 mb-4">
                    {[...Array(5)].map((_, i) => (
                      <svg key={i} className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                      </svg>
                    ))}
                    <span className="text-sm text-gray-500 ml-1">(4.5)</span>
                  </div>
                  <p className="text-sm text-gray-500">Category: <span className="font-medium text-gray-700">{product.Category}</span></p>
                </div>
                <button
                  className={`w-full py-3 px-4 mt-6 rounded-lg font-medium transition-all duration-200 ${
                    product.Stock === "in"
                      ? "bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:shadow-lg transform hover:scale-105"
                      : "bg-gray-200 text-gray-500 cursor-not-allowed"
                  }`}
                  onClick={() => {
                    if (product.Stock === "in") {
                      if (isInCart) {
                        toggleCart();
                        onClose(); // Close modal after opening cart
                      } else {
                        addToCart(product);
                      }
                    }
                  }}
                  disabled={product.Stock !== "in"}
                >
                  {product.Stock === "in"
                    ? (isInCart ? "View Cart" : "Add to Cart")
                    : "Out of Stock"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Enhanced Cart Sidebar
    const CartSidebar = ({ cart, removeFromCart, isCartOpen, toggleCart, checkout, updateQuantity }) => {
      const total = cart.reduce((sum, item) => sum + (parseFloat(item.Price) * item.quantity), 0);
      const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <>
          {isCartOpen && <div className="fixed inset-0 bg-black bg-opacity-50 z-40" onClick={toggleCart}></div>}
          <div className={`fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform transition-transform duration-300 z-50 ${
            isCartOpen ? 'translate-x-0' : 'translate-x-full'
          }`}>
            <div className="flex flex-col h-full">
              <div className="p-6 border-b border-gray-200">
                <div className="flex justify-between items-center">
                  <h2 className="text-xl font-bold text-gray-800">Shopping Cart</h2>
                  <button onClick={toggleCart} className="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                </div>
                <p className="text-sm text-gray-500 mt-1">{itemCount} items</p>
              </div>

              <div className="flex-1 overflow-y-auto p-6">
                {cart.length === 0 ? (
                  <div className="text-center py-12">
                    <svg className="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <p className="text-gray-500">Your cart is empty</p>
                    <p className="text-sm text-gray-400 mt-2">Add some products to get started</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {cart.map((item, index) => (
                      <div key={index} className="flex items-center space-x-4 p-4 bg-gray-50 rounded-lg">
                        <img src={item.Image} alt={item.Name} className="w-16 h-16 object-cover rounded-lg" />
                        <div className="flex-1">
                          <h3 className="font-medium text-gray-800">{item.Name}</h3>
                          <p className="text-sm text-gray-500">₹{parseFloat(item.Price).toLocaleString()}</p>
                          <div className="flex items-center mt-2 space-x-2">
                            <button
                              onClick={() => updateQuantity(index, Math.max(1, item.quantity - 1))}
                              className="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-sm"
                            >
                              −
                            </button>
                            <span className="text-sm font-medium">{item.quantity}</span>
                            <button
                              onClick={() => updateQuantity(index, item.quantity + 1)}
                              className="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-sm"
                            >
                              +
                            </button>
                          </div>
                        </div>
                        <button
                          onClick={() => removeFromCart(index)}
                          className="text-red-500 hover:text-red-700"
                        >
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                          </svg>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {cart.length > 0 && (
                <div className="p-6 border-t border-gray-200 bg-gray-50">
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm">
                      <span>Subtotal</span>
                      <span>₹{total.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between text-sm">
                      <span>Shipping</span>
                      <span className={total > 50000 ? 'text-green-600' : ''}>{total > 50000 ? 'Free' : '₹5.99'}</span>
                    </div>
                    <div className="border-t pt-3">
                      <div className="flex justify-between font-bold text-lg">
                        <span>Total</span>
                        <span>₹{(total + (total > 50000 ? 0 : 5.99)).toLocaleString()}</span>
                      </div>
                    </div>
                    {total <= 50000 && (
                      <p className="text-xs text-blue-600 bg-blue-50 p-2 rounded">
                        Add ₹{(50000 - total).toLocaleString()} more for free shipping!
                      </p>
                    )}
                    <button
                      onClick={checkout}
                      className="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-medium hover:shadow-lg transform hover:scale-105 transition-all duration-200"
                    >
                      Purchase through WhatsApp
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </>
      );
    };

    // Enhanced Product Card
    const ProductCard = ({ product, addToCart, cart, toggleCart, onProductClick }) => {
      const [imageLoaded, setImageLoaded] = React.useState(false);
      const isInCart = cart.some(item => item.ID === product.ID);

      return (
        <div
          className="product-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl cursor-pointer"
          onClick={() => onProductClick(product)}
        >
          <div className="relative">
            <div className="aspect-square bg-gray-100 flex items-center justify-center">
              {!imageLoaded && (
                <div className="animate-pulse bg-gray-200 w-full h-full"></div>
              )}
              <img
                src={product.Image}
                alt={product.Name}
                className={`w-full h-full object-cover transition-opacity duration-300 ${imageLoaded ? 'opacity-100' : 'opacity-0'}`}
                onLoad={() => setImageLoaded(true)}
                onError={(e) => {
                  e.target.src = "https://images.unsplash.com/photo-1518314916381-77a37c2a49ae?w=300";
                  setImageLoaded(true);
                }}
              />
            </div>
            <div className="absolute top-3 left-3">
              <span className={`px-2 py-1 text-xs font-medium rounded-full ${
                product.Stock === "in" ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
              }`}>
                {product.Stock === "in" ? 'In Stock' : 'Out of Stock'}
              </span>
            </div>
            <div className="absolute top-3 right-3">
              <span className="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded-full">
                {product.Category}
              </span>
            </div>
          </div>

          <div className="p-6">
            <h3 className="text-lg font-semibold text-gray-800 mb-2 line-clamp-1">{product.Name}</h3>
            <p className="text-sm text-gray-600 mb-4 line-clamp-2">{product.Description}</p>

            <div className="flex items-center justify-between mb-4">
              <div className="text-2xl font-bold text-blue-600">
                ₹{parseFloat(product.Price).toLocaleString()}
              </div>
              <div className="flex items-center space-x-1">
                {[...Array(5)].map((_, i) => (
                  <svg key={i} className="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                  </svg>
                ))}
                <span className="text-sm text-gray-500 ml-1">(4.5)</span>
              </div>
            </div>

            <button
              className={`w-full py-3 px-4 rounded-lg font-medium transition-all duration-200 ${
                product.Stock === "in"
                  ? "bg-gradient-to-r from-blue-600 to-purple-600 text-white hover:shadow-lg transform hover:scale-105"
                  : "bg-gray-200 text-gray-500 cursor-not-allowed"
              }`}
              onClick={(e) => {
                e.stopPropagation(); // Prevent card click from triggering when button is clicked
                if (product.Stock === "in") {
                  if (isInCart) {
                    toggleCart();
                  } else {
                    addToCart(product);
                  }
                }
              }}
              disabled={product.Stock !== "in"}
            >
              {product.Stock === "in"
                ? (isInCart ? "View Cart" : "Add to Cart")
                : "Out of Stock"}
            </button>
          </div>
        </div>
      );
    };

    // About Section
    const AboutSection = () => {
      return (
        <section id="about" className="py-20 bg-gray-900 text-white">
          <div className="container mx-auto px-4">
            <div className="max-w-4xl mx-auto text-center">
              <h2 className="text-4xl font-bold mb-8">About Edapt Shop</h2>
              <p className="text-xl mb-12 opacity-90">
                Leading the revolution in technology solutions with innovative products that bridge the gap between imagination and reality.
              </p>
              <div className="grid md:grid-cols-3 gap-8">
                <div className="text-center">
                  <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                  </div>
                  <h3 className="text-xl font-semibold mb-2">Innovation</h3>
                  <p className="opacity-80">Cutting-edge technology solutions for the modern world</p>
                </div>
                <div className="text-center">
                  <div className="w-16 h-16 bg-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                  <h3 className="text-xl font-semibold mb-2">Quality</h3>
                  <p className="opacity-80">Premium products with rigorous testing and certification</p>
                </div>
                <div className="text-center">
                  <div className="w-16 h-16 bg-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                  </div>
                  <h3 className="text-xl font-semibold mb-2">Support</h3>
                  <p className="opacity-80">24/7 expert support and comprehensive warranty coverage</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // Enhanced Filter Sidebar
    const FilterSidebar = ({ categories, filters, setFilters }) => {
      return (
        <div className="bg-white rounded-xl shadow-md p-6 sticky top-24">
          <h2 className="text-xl font-bold mb-6 text-gray-800">Filters</h2>

          <div className="space-y-6">
            <div>
              <h3 className="font-semibold mb-3 text-gray-700">Categories</h3>
              <div className="space-y-2">
                {categories.map((category) => (
                  <label key={category} className="flex items-center space-x-2 cursor-pointer">
                    <input
                      type="radio"
                      name="category"
                      checked={filters.category === category}
                      onChange={() => setFilters(prev => ({ ...prev, category }))}
                      className="text-blue-600"
                    />
                    <span className="text-sm text-gray-600">{category}</span>
                  </label>
                ))}
              </div>
            </div>

            <div>
              <h3 className="font-semibold mb-3 text-gray-700">Price Range</h3>
              <div className="space-y-2">
                <label className="flex items-center space-x-2 cursor-pointer">
                  <input
                    type="radio"
                    name="price"
                    checked={filters.priceRange === 'all'}
                    onChange={() => setFilters(prev => ({ ...prev, priceRange: 'all' }))}
                    className="text-blue-600"
                  />
                  <span className="text-sm text-gray-600">All Prices</span>
                </label>
                <label className="flex items-center space-x-2 cursor-pointer">
                  <input
                    type="radio"
                    name="price"
                    checked={filters.priceRange === 'low'}
                    onChange={() => setFilters(prev => ({ ...prev, priceRange: 'low' }))}
                    className="text-blue-600"
                  />
                  <span className="text-sm text-gray-600">Under ₹5,000</span>
                </label>
                <label className="flex items-center space-x-2 cursor-pointer">
                  <input
                    type="radio"
                    name="price"
                    checked={filters.priceRange === 'mid'}
                    onChange={() => setFilters(prev => ({ ...prev, priceRange: 'mid' }))}
                    className="text-blue-600"
                  />
                  <span className="text-sm text-gray-600">₹5,000 - ₹20,000</span>
                </label>
                <label className="flex items-center space-x-2 cursor-pointer">
                  <input
                    type="radio"
                    name="price"
                    checked={filters.priceRange === 'high'}
                    onChange={() => setFilters(prev => ({ ...prev, priceRange: 'high' }))}
                    className="text-blue-600"
                  />
                  <span className="text-sm text-gray-600">Over ₹20,000</span>
                </label>
              </div>
            </div>

            <div>
              <h3 className="font-semibold mb-3 text-gray-700">Availability</h3>
              <div className="space-y-2">
                <label className="flex items-center space-x-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={filters.inStockOnly}
                    onChange={(e) => setFilters(prev => ({ ...prev, inStockOnly: e.target.checked }))}
                    className="text-blue-600"
                  />
                  <span className="text-sm text-gray-600">In Stock Only</span>
                </label>
              </div>
            </div>

            <div>
              <h3 className="font-semibold mb-3 text-gray-700">Sort By</h3>
              <select
                value={filters.sortBy}
                onChange={(e) => setFilters(prev => ({ ...prev, sortBy: e.target.value }))}
                className="w-full p-2 border border-gray-300 rounded-lg text-sm"
              >
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="price-asc">Price (Low to High)</option>
                <option value="price-desc">Price (High to Low)</option>
              </select>
            </div>
          </div>
        </div>
      );
    };

    // Main App Component
    const App = () => {
      const [products, setProducts] = React.useState([]);
      const [filters, setFilters] = React.useState({
        category: "All",
        priceRange: "all",
        sortBy: "name-asc",
        inStockOnly: false
      });
      const [searchQuery, setSearchQuery] = React.useState("");
      const [cart, setCart] = React.useState([]);
      const [isCartOpen, setIsCartOpen] = React.useState(false);
      const [loading, setLoading] = React.useState(true);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false); // State for mobile menu
      const [selectedProduct, setSelectedProduct] = React.useState(null); // State for selected product for modal
      const [highlightCart, setHighlightCart] = React.useState(false); // New state for cart highlight animation

      // Load and parse CSV data
      React.useEffect(() => {
        Papa.parse(csvData, {
          header: true,
          skipEmptyLines: true,
          transformHeader: (header) => header.trim(),
          transform: (value, header) => {
            const cleaned = value.trim();
            if (header === "Price") {
              return isNaN(parseFloat(cleaned)) ? 0 : parseFloat(cleaned);
            }
            return cleaned;
          },
          complete: (results) => {
            setProducts(results.data);
            setLoading(false);
          },
          error: (err) => {
            console.error(err);
            setLoading(false);
          },
        });
      }, []);

      // Enhanced add to cart with quantity support and highlight animation
      const addToCart = (product) => {
        const existingItemIndex = cart.findIndex(item => item.ID === product.ID);
        if (existingItemIndex >= 0) {
          const newCart = [...cart];
          newCart[existingItemIndex].quantity += 1;
          setCart(newCart);
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
        // Trigger cart highlight animation
        setHighlightCart(true);
        setTimeout(() => {
          setHighlightCart(false);
        }, 600); // Duration of the cart-highlight animation
      };

      // Remove from cart
      const removeFromCart = (index) => {
        setCart(cart.filter((_, i) => i !== index));
      };

      // Update quantity
      const updateQuantity = (index, newQuantity) => {
        if (newQuantity === 0) {
          removeFromCart(index);
        } else {
          const newCart = [...cart];
          newCart[index].quantity = newQuantity;
          setCart(newCart);
        }
      };

      // Enhanced checkout with WhatsApp integration
      const checkout = () => {
        if (cart.length === 0) {
          alert("Your cart is empty!");
          return;
        }

        const phoneNumber = "7356568721"; // The WhatsApp number
        let message = "Hello Edapt Shop! I'd like to purchase the following items:\n\n";

        cart.forEach(item => {
            message += `${item.Name} (Quantity: ${item.quantity}) - ₹${parseFloat(item.Price).toLocaleString()}\n`;
        });

        const total = cart.reduce((sum, item) => sum + (parseFloat(item.Price) * item.quantity), 0);
        message += `\nTotal: ₹${total.toLocaleString()}`;

        // Encode the message for the URL
        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

        // Open WhatsApp Web
        window.open(whatsappUrl, '_blank');

        // Optionally, clear the cart after opening WhatsApp
        // setCart([]);
        // setIsCartOpen(false);
      };

      // Toggle cart visibility
      const toggleCart = () => setIsCartOpen(!isCartOpen);

      // Handle product click to show modal
      const handleProductClick = (product) => {
        setSelectedProduct(product);
      };

      // Close product detail modal
      const closeProductDetailModal = () => {
        setSelectedProduct(null);
      };

      // Smooth scroll to section
      const scrollToSection = (sectionId) => {
        const element = document.getElementById(sectionId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
        setIsMobileMenuOpen(false); // Close mobile menu after clicking a link
      };

      // Enhanced filtering and sorting
      const filteredProducts = products
        .filter((product) => {
          const matchesCategory = filters.category === "All" || product.Category === filters.category;
          const matchesStock = !filters.inStockOnly || product.Stock === "in";
          const matchesSearch = !searchQuery ||
            product.Name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            product.Category.toLowerCase().includes(searchQuery.toLowerCase()) ||
            product.Description.toLowerCase().includes(searchQuery.toLowerCase());

          let matchesPrice = true;
          if (filters.priceRange !== 'all') {
            const price = parseFloat(product.Price);
            switch (filters.priceRange) {
              case 'low': matchesPrice = price < 5000; break;
              case 'mid': matchesPrice = price >= 5000 && price <= 20000; break;
              case 'high': matchesPrice = price > 20000; break;
            }
          }

          return matchesCategory && matchesStock && matchesSearch && matchesPrice;
        })
        .sort((a, b) => {
          switch (filters.sortBy) {
            case "price-asc": return parseFloat(a.Price) - parseFloat(b.Price);
            case "price-desc": return parseFloat(b.Price) - parseFloat(a.Price);
            case "name-asc": return a.Name.localeCompare(b.Name);
            case "name-desc": return b.Name.localeCompare(a.Name);
            default: return 0;
          }
        });

      // Get unique categories
      const categories = ["All", ...new Set(products.map((p) => p.Category))];
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <div className="min-h-screen">
          <nav className="bg-white shadow-md py-2 fixed top-0 w-full z-50">
            <div className="container mx-auto px-4 flex items-center justify-between h-16">

                <div className="flex items-center space-x-40 flex-grow">
                    <a href="#" className="flex-shrink-0">
                        <img src="https://digitalskills.iitmpravartak.org.in/assets/images/learning/edapt/logo.png" alt="Edapt Logo" className="h-8 w-auto"/>
                        <span className="sr-only">Edapt</span>
                    </a>

                    <div className="relative flex-grow max-w-2xl">
                        <input
                            type="text"
                            placeholder="Search for products, brands and more"
                            className="w-full pl-12 pr-4 py-2 text-sm border-2 border-gray-200 rounded-md bg-gray-100 focus:outline-none focus:border-blue-500"
                            onChange={(e) => setSearchQuery(e.target.value)}
                        />
                        <div className="absolute left-4 top-1/2 transform -translate-y-1/2">
                            <svg className="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m21 21-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div className="flex items-center space-x-6 flex-shrink-0">
                    <button onClick={() => scrollToSection('products')} className="text-gray-800 font-medium hover:text-blue-600 hidden md:block">Products</button>
                    <button onClick={() => scrollToSection('about')} className="text-gray-800 font-medium hover:text-blue-600 hidden md:block">About</button>

                    <div className="relative group hidden md:block">
                        <button className="flex items-center text-gray-800 font-medium hover:text-blue-600">
                            More
                            <svg className="w-4 h-4 ml-1 transform group-hover:rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div className="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-md shadow-lg py-1 hidden group-hover:block">
                            <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Notification Preferences</a>
                            <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">24x7 Customer Care</a>
                            <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Advertise</a>
                            <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Download App</a>
                        </div>
                    </div>

                    <button
                      onClick={toggleCart}
                      className={`relative flex items-center text-gray-800 font-medium hover:text-blue-600 ${
                        cartCount > 0 ? 'floating-cart' : ''
                      } ${highlightCart ? 'animate-cart-highlight' : ''}`}
                    >
                      <svg className="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                      </svg>
                      Cart
                      {cartCount > 0 && (
                        <span className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold animate-pulse">
                          {cartCount}
                        </span>
                      )}
                    </button>


                    <button className="lg:hidden p-2 text-gray-700 hover:text-blue-600" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>

            <div className={`lg:hidden ${isMobileMenuOpen ? 'block' : 'hidden'} bg-white border-t border-gray-200 py-4 px-4`}>
                <div className="space-y-4">
                    <button onClick={() => scrollToSection('products')} className="block text-gray-800 font-medium hover:text-blue-600">Products</button>
                    <button onClick={() => scrollToSection('about')} className="block text-gray-800 font-medium hover:text-blue-600">About</button>
                    <a href="#" className="block text-gray-800 font-medium hover:text-blue-600">More</a>
                    <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Notification Preferences</a>
                    <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">24x7 Customer Care</a>
                    <a href="#" className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Download Edapt App</a>
                </div>
            </div>
          </nav>

          <CartSidebar
            cart={cart}
            removeFromCart={removeFromCart}
            isCartOpen={isCartOpen}
            toggleCart={toggleCart}
            checkout={checkout}
            updateQuantity={updateQuantity}
          />

          {selectedProduct && (
            <ProductDetailModal
              product={selectedProduct}
              onClose={closeProductDetailModal}
              addToCart={addToCart}
              cart={cart}
              toggleCart={toggleCart}
            />
          )}

          <div className="pt-200"> {/* Added pt-20 to push content below fixed navbar */}

            <section id="products" className="py-200">
              <div className="container mx-auto px-4">
                <div className="text-center mb-12">
                 
                </div>

                {loading ? (
                  <div className="flex justify-center items-center py-20">
                    <div className="animate-spin rounded-full h-16 w-16 border-b-2 border-blue-600"></div>
                  </div>
                ) : (
                  <div className="flex flex-col lg:flex-row gap-8">
                    <div className="lg:w-1/4">
                      <FilterSidebar
                        categories={categories}
                        filters={filters}
                        setFilters={setFilters}
                      />
                    </div>

                    <div className="lg:w-3/4">
                      <div className="flex justify-between items-center mb-6">
                        <p className="text-gray-600">
                          Showing {filteredProducts.length} of {products.length} products
                        </p>
                        <div className="flex items-center space-x-2">
                          <span className="text-sm text-gray-600">View:</span>
                          <button className="p-2 bg-blue-100 text-blue-600 rounded">
                            <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                              <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                            </svg>
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                        {filteredProducts.length > 0 ? (
                          filteredProducts.map((product) => (
                            <div key={product.ID} className="animate-slide-up">
                              <ProductCard
                                product={product}
                                addToCart={addToCart}
                                cart={cart}
                                toggleCart={toggleCart}
                                onProductClick={handleProductClick}
                              />
                            </div>
                          ))
                        ) : (
                          <div className="col-span-full text-center py-12">
                            <svg className="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <h3 className="text-xl font-semibold text-gray-600 mb-2">No products found</h3>
                            <p className="text-gray-500">Try adjusting your filters or search query</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </section>
          </div> {/* End of pt-20 div */}

          <AboutSection />

          {/* Enhanced Footer */}
          <footer className="bg-gray-900 text-white py-16">
            <div className="container mx-auto px-4">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <div>
                  <div className="flex items-center space-x-2 mb-4">
                    <div className="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
                      <span className="text-white font-bold text-xl">T</span>
                    </div>
                    <h3 className="text-xl font-bold">Edapt</h3>
                  </div>
                  <p className="text-gray-400 mb-4">
                    Leading innovation in technology solutions for a smarter tomorrow.
                  </p>
                  <div className="flex space-x-4">
                    <a href="#" className="text-gray-400 hover:text-white transition">
                      <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/>
                      </svg>
                    </a>
                    <a href="#" className="text-gray-400 hover:text-white transition">
                      <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/>
                      </svg>
                    </a>
                    <a href="#" className="text-gray-400 hover:text-white transition">
                      <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                      </svg>
                    </a>
                  </div>
                </div>

                <div>
                  <h4 className="text-lg font-semibold mb-4">Quick Links</h4>
                  <ul className="space-y-2 text-gray-400">
                    <li><a href="#products" className="hover:text-white transition" onClick={() => scrollToSection('products')}>Products</a></li>
                    <li><a href="#about" className="hover:text-white transition" onClick={() => scrollToSection('about')}>About Us</a></li>
                    <li><a href="#" className="hover:text-white transition">Contact</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-lg font-semibold mb-4">Categories</h4>
                  <ul className="space-y-2 text-gray-400">
                    <li><a href="#" className="hover:text-white transition">Robotics</a></li>
                    <li><a href="#" className="hover:text-white transition">Hello Ai Books</a></li>
                    <li><a href="#" className="hover:text-white transition">CNC</a></li>
                    <li><a href="#" className="hover:text-white transition">Lighting</a></li>
                    <li><a href="#" className="hover:text-white transition">Smart Devices</a></li>
                    <li><a href="#" className="hover:text-white transition">Gaming</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-lg font-semibold mb-4">Contact Info</h4>
                  <div className="space-y-2 text-gray-400">
                    <p className="flex items-center">
                      <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                      </svg>
                      hello@edapt.me
                    </p>
                    <p className="flex items-center">
                      <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                      </svg>
                      +1 (555) 123-4567
                    </p>
                    <p className="flex items-center">
                      <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                      </svg>
                      San Francisco, CA
                    </p>
                  </div>
                </div>
              </div>

              <div className="border-t border-gray-800 pt-8">
                <div className="flex flex-col md:flex-row justify-between items-center">
                  <p className="text-gray-400 text-sm">
                    © 2025 Edapt. All rights reserved.
                  </p>
                  <div className="flex space-x-6 mt-4 md:mt-0">
                    <a href="#" className="text-gray-400 hover:text-white text-sm transition">Privacy Policy</a>
                    <a href="#" className="text-gray-400 hover:text-white text-sm transition">Terms of Service</a>
                    <a href="#" className="text-gray-400 hover:text-white text-sm transition">Cookie Policy</a>
                  </div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
